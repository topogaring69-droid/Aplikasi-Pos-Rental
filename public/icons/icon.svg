<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <rect x="20" y="20" width="472" height="472" rx="95" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Motor / Scooter Graphics -->
  <g transform="translate(64, 90)" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wheels -->
    <circle cx="70" cy="230" r="46" stroke="#ffffff" stroke-width="20" fill="#0f172a" />
    <circle cx="70" cy="230" r="16" fill="url(#goldGrad)" stroke="none" />
    
    <circle cx="314" cy="230" r="46" stroke="#ffffff" stroke-width="20" fill="#0f172a" />
    <circle cx="314" cy="230" r="16" fill="url(#goldGrad)" stroke="none" />
    
    <!-- Body Frame -->
    <path d="M70 230 L140 230 L195 160 L280 160 L314 230" stroke="#ffffff" stroke-width="18" />
    <path d="M195 160 L240 70 L280 70" stroke="#ffffff" stroke-width="18" />
    <!-- Handlebars -->
    <path d="M260 50 L300 75" stroke="url(#goldGrad)" stroke-width="20" />
    <!-- Seat -->
    <path d="M130 145 C150 130, 200 130, 215 155" stroke="url(#goldGrad)" stroke-width="22" />
    <!-- Headlight -->
    <circle cx="288" cy="85" r="12" fill="#38bdf8" stroke="none" />
  </g>

  <!-- POS Receipt Badge on bottom right -->
  <g transform="translate(290, 270)">
    <rect width="170" height="180" rx="20" fill="#ffffff" filter="drop-shadow(0 15px 25px rgba(0,0,0,0.35))" />
    <!-- Receipt Header -->
    <rect x="25" y="25" width="120" height="14" rx="7" fill="#059669" />
    <rect x="25" y="52" width="85" height="9" rx="4.5" fill="#cbd5e1" />
    <rect x="25" y="70" width="120" height="4" fill="#e2e8f0" />
    <rect x="25" y="85" width="70" height="9" rx="4.5" fill="#94a3b8" />
    <rect x="110" y="85" width="35" height="9" rx="4.5" fill="#059669" />
    <rect x="25" y="105" width="60" height="9" rx="4.5" fill="#94a3b8" />
    <rect x="100" y="105" width="45" height="9" rx="4.5" fill="#059669" />
    <rect x="25" y="125" width="120" height="4" fill="#e2e8f0" />
    <circle cx="85" cy="150" r="14" fill="#10b981" />
    <path d="M78 150 L83 155 L93 144" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
